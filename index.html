<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1 MUSIC - MCN Dashboard (MoM Edition)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Sarabun', sans-serif; color: #0f172a; }
        .container { padding: 24px; }
        .card { background: #ffffff; border-radius: 12px; padding: 18px; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin: 0; color: #0284c7; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .btn-group { display: flex; gap: 6px; margin-bottom: 16px; }
        .btn { padding: 8px 16px; background: #fff; color: #0f172a; border: 1px solid #e2e8f0; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn.active { background: #0284c7; color: #fff; }
        .badge { display: inline-flex; align-items: center; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-right: 6px; margin-bottom: 6px; }
        .badge-asset { background: #f0fdf4; color: #166534; }
        .btn-del { background: #fee2e2; color: #dc2626; border: none; border-radius: 4px; padding: 2px 6px; font-size: 10px; cursor: pointer; margin-left: 6px; }
        select { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 7px; padding: 7px 12px; color: #0f172a; font-size: 12px; font-weight: bold; }
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 12px 12px; text-align: left; color: #64748b; font-weight: 600; border-bottom: 2px solid #e2e8f0; background-color: #f1f5f9; font-size: 11px; white-space: nowrap; }
        td { padding: 12px 12px; border-bottom: 1px solid #e2e8f0; font-size: 13px; white-space: nowrap; vertical-align: top; }
        .input-file-label { font-weight: bold; font-size: 12px; color: #0284c7; display: block; margin-bottom: 8px; }
        .hidden { display: none; }
        .mom-val { font-size: 10px; display: block; font-weight: bold; margin-top: 2px; }
        .up { color: #16a34a; }
        .down { color: #dc2626; }
        .neutral { color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>📊 S1 MUSIC - ศูนย์บริหารข้อมูลเครือข่ายพันธมิตร (Full MoM Analysis)</h2>
            <div style="margin-top: 12px;" id="badge-container">
                <small style="color: #64748b;">ยังไม่มีชุดข้อมูลในระบบ โปรดอัปโหลดไฟล์ CSV ด้านล่าง</small>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <label class="input-file-label">📁 เลือกไฟล์สรุปรายช่องทาง (เช่น APR.csv, MAY.csv)</label>
                <input type="file" id="channel-upload" accept=".csv" />
            </div>
            <div class="card">
                <label class="input-file-label">💎 เลือกไฟล์สรุปรายชิ้นงานลิขสิทธิ์ Asset เพลง</label>
                <input type="file" id="asset-upload" accept=".csv" />
            </div>
        </div>

        <div class="btn-group">
            <button class="btn active" id="tab-overview" onclick="switchTab('overview')">📺 ตารางข้อมูลรายช่อง ข้ามเดือน MoM</button>
            <button class="btn" id="tab-assets" onclick="switchTab('assets')">🎵 ตารางข้อมูลราย Asset ข้ามเดือน MoM</button>
        </div>

        <div class="card">
            <div id="view-overview">
                <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 16px;">
                    <span style="font-size: 12px; font-weight: bold;">เปรียบเทียบงวดเวลาช่อง:</span>
                    <select id="channel-base-select" onchange="renderChannelTable()"><option value="">เลือกเดือนฐาน</option></select>
                    <span>➔</span>
                    <select id="channel-target-select" onchange="renderChannelTable()"><option value="">เลือกเดือนเปรียบเทียบ</option></select>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: left;">ชื่อช่องพาร์ทเนอร์</th>
                                <th style="text-align: right;">รายได้สุทธิ (THB)</th>
                                <th style="text-align: right;">Premium รายได้ (THB)</th>
                                <th style="text-align: right;">ยอดวิวรวม (Views)</th>
                                <th style="text-align: right;">RPM (THB)</th>
                                <th style="text-align: right;">Playback CPM (THB)</th>
