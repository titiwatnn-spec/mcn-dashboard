<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCN Analytics Dashboard</title>
    <!-- โหลด Library ที่จำเป็น (React, Babel, Recharts) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Sarabun', sans-serif; color: #0f172a; }
        #root { min-height: 100vh; }
        .loader { display: flex; justify-content: center; align-items: center; height: 100vh; font-weight: bold; }
    </style>
</head>
<body>
    <div id="root"><div class="loader">กำลังเริ่มระบบแดชบอร์ด...</div></div>

    <script type="text/babel">
        // ดึงความสามารถจาก Library ออกมาใช้งาน
        const { useState, useCallback, useMemo, useEffect } = React;
        const { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = window.Recharts;

        // ─── CONFIG & STYLES ───
        const CI = { blueBrand: "#0284c7", border: "#e2e8f0", card: "#ffffff", muted: "#64748b" };
        const STYLES = {
            card: { background: CI.card, borderRadius: 12, padding: 18, border: `1px solid ${CI.border}`, boxShadow: "0 1px 3px 0 rgba(0, 0, 0, 0.05)", marginBottom: 20 },
            badge: { display: "inline-flex", alignItems: "center", background: "#e0f2fe", color: "#0369a1", padding: "4px 10px", borderRadius: "12px", fontSize: "11px", fontWeight: "bold", marginRight: "6px" },
            th: { padding: "10px", textAlign: "left", color: CI.muted, borderBottom: `2px solid ${CI.border}`, backgroundColor: "#f1f5f9" },
            td: { padding: "10px", borderBottom: `1px solid ${CI.border}`, fontSize: "13px" }
        };

        const fmtTHB = (v) => "฿" + Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
        const fmtNum = (v) => Number(v || 0).toLocaleString();
        const pct = (a, b) => (b ? (((a - b) / b) * 100).toFixed(1) : "0.0");

        // ─── APP COMPONENT ───
        function YTDashboard() {
            const [months, setMonths] = useState([]);
            const [assets, setAssets] = useState([]);
            const [tab, setTab] = useState("overview");
            const [baseMonth, setBaseMonth] = useState("");
            const [targetMonth, setTargetMonth] = useState("");

            // จัดการข้อมูลเข้า
            const handleFile = (fname, rows) => {
                const label = fname.replace(".csv", "").toUpperCase();
                const isAsset = rows[0]?.hasOwnProperty("Asset");
                const processed = rows.filter(r => r.Channel || r.Asset).map(r => ({
                    id: r.Channel || r.Asset,
                    name: r.Title || r["Channel title"] || r.Asset || "N/A",
                    rev: parseFloat(String(Object.values(r).find((v, i) => Object.keys(r)[i].includes("Revenue")) || 0).replace(/[^0-9.-]/g, "")) || 0,
                    views: parseFloat(String(r.Views || 0).replace(/[^0-9.-]/g, "")) || 0
                }));
                const setter = isAsset ? setAssets : setMonths;
                setter(prev => [...prev.filter(m => m.label !== label), { label, data: processed }]);
            };

            const channelAnalysis = useMemo(() => {
                const cur = months.find(m => m.label === targetMonth);
                const prev = months.find(m => m.label === baseMonth);
                if (!cur) return [];
                return cur.data.map(c2 => {
                    const c1 = prev?.data.find(x => x.id === c2.id);
                    return { ...c2, growth: pct(c2.rev, c1?.rev || 0) };
                }).sort((a, b) => b.rev - a.rev);
            }, [months, baseMonth, targetMonth]);

            return (
                <div style={{ padding: 24 }}>
                    <div style={STYLES.card}>
                        <h2 style={{ margin: 0, color: CI.blueBrand }}>📡 MCN Dashboard (GitHub Version)</h2>
                        <div style={{ marginTop: 10 }}>
                            {months.map(m => <span key={m.label} style={STYLES.badge}>{m.label} <button onClick={() => setMonths(prev => prev.filter(x => x.label !== m.label))} style={{border:'none', background:'none', cursor:'pointer', color:'red'}}>✕</button></span>)}
                        </div>
                    </div>

                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
                        <div style={STYLES.card}>
                            <label style={{fontSize:12, fontWeight:'bold'}}>📁 อัปโหลดไฟล์ CSV (Channel หรือ Asset):</label><br/>
                            <input type="file" style={{marginTop:10}} onChange={e => {
                                const file = e.target.files[0];
                                if (!file) return;
                                const reader = new FileReader();
                                reader.onload = (evt) => {
                                    const lines = evt.target.result.split("\n");
                                    const headers = lines[0].split(",").map(h => h.trim().replace(/"/g, ""));
                                    const data = lines.slice(1).map(line => {
                                        const values = line.split(",").map(v => v.trim().replace(/"/g, ""));
                                        return headers.reduce((obj, h, i) => ({ ...obj, [h]: values[i] }), {});
                                    });
                                    handleFile(file.name, data);
                                };
                                reader.readAsText(file);
                            }} />
                        </div>
                    </div>

                    <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
                        <button onClick={() => setTab("overview")} style={{ padding: '10px 20px', borderRadius: 8, cursor: 'pointer', border: '1px solid #ddd', background: tab==='overview' ? CI.blueBrand : '#fff', color: tab==='overview' ? '#fff' : '#333' }}>ตารางข้อมูล</button>
                        <button onClick={() => setTab("charts")} style={{ padding: '10px 20px', borderRadius: 8, cursor: 'pointer', border: '1px solid #ddd', background: tab==='charts' ? CI.blueBrand : '#fff', color: tab==='charts' ? '#fff' : '#333' }}>กราฟแนวโน้ม</button>
                    </div>

                    {tab === "overview" && (
                        <div style={STYLES.card}>
                            <div style={{ marginBottom: 15, display: 'flex', gap: 10, alignItems: 'center' }}>
                                <span>เปรียบเทียบ:</span>
                                <select onChange={e => setBaseMonth(e.target.value)} style={{padding:5}}><option value="">เลือกเดือนฐาน</option>{months.map(m => <option key={m.label}>{m.label}</option>)}</select>
                                <span>➔</span>
                                <select onChange={e => setTargetMonth(e.target.value)} style={{padding:5}}><option value="">เลือกเดือนเป้าหมาย</option>{months.map(m => <option key={m.label}>{m.label}</option>)}</select>
                            </div>
                            <div style={{overflowX:'auto'}}>
                                <table style={{ width: "100%", borderCollapse: "collapse" }}>
                                    <thead>
                                        <tr>
                                            <th style={STYLES.th}>ชื่อ</th>
                                            <th style={{...STYLES.th, textAlign:'right'}}>รายได้</th>
                                            <th style={{...STYLES.th, textAlign:'right'}}>ยอดวิว</th>
                                            <th style={{...STYLES.th, textAlign:'right'}}>เติบโต %</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {channelAnalysis.map((ch, i) => (
                                            <tr key={i}>
                                                <td style={STYLES.td}>{ch.name}</td>
                                                <td align="right" style={{...STYLES.td, color: CI.blueBrand, fontWeight:'bold'}}>{fmtTHB(ch.rev)}</td>
                                                <td align="right" style={STYLES.td}>{fmtNum(ch.views)}</td>
                                                <td align="right" style={{...STYLES.td, color: parseFloat(ch.growth) >= 0 ? 'green' : 'red', fontWeight:'bold'}}>{ch.growth}%</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {tab === "charts" && (
                        <div style={STYLES.card}>
                            <div style={{ height: 300 }}>
                                <ResponsiveContainer width="100%" height="100%">
                                    <AreaChart data={months.map(m => ({ name: m.label, rev: m.data.reduce((s, x) => s + x.rev, 0) }))}>
                                        <CartesianGrid strokeDasharray="3 3" />
                                        <XAxis dataKey="name" />
                                        <YAxis tickFormatter={v => (v/1000).toFixed(0)+'k'} />
                                        <Tooltip formatter={v => fmtTHB(v)} />
                                        <Area type="monotone" dataKey="rev" stroke={CI.blueBrand} fill="#e0f2fe" />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // เรนเดอร์แอป
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<YTDashboard />);
    </script>
</body>
</html>
