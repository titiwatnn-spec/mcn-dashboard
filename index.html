        const fmtTHB = (v) => "฿" + Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });

        const pct = (a, b) => {
          if (!b || b === 0) return "0.0";
          return (((a - b) / b) * 100).toFixed(1);
        };

        const getMonthWeight = (label) => {
          const l = String(label).toLowerCase();
          if (l.includes("jan")) return 1;  if (l.includes("feb")) return 2;
          if (l.includes("mar")) return 3;  if (l.includes("apr")) return 4;
          if (l.includes("may")) return 5;  if (l.includes("jun")) return 6;
          if (l.includes("jul")) return 7;  if (l.includes("aug")) return 8;
          if (l.includes("sep")) return 9;  if (l.includes("oct")) return 10;
          if (l.includes("nov")) return 11; if (l.includes("dec")) return 12;
          return 99;
        };
