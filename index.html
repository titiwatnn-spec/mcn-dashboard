<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1 MUSIC - MCN Dashboard</title>
    <!-- โหลดสคริปต์ React และไลบรารีกราฟจากคลัง CDN ที่มีความเสถียรสูงสุด -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; font-family: 'Sarabun', sans-serif; color: #0f172a; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <!-- ระบบจะวาดหน้าเว็บลงที่ตรงนี้ทันทีเมื่อโค้ดอ่านเสร็จ -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useMemo, useEffect } = React;

        const fmtTHB = (v) => "฿" + Number(v || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
        const fmtNum = (v) => Number(v || 0).toLocaleString();
        const pct = (a, b) => (b ? (((a - b) / b) * 100).toFixed(1) : "0.0");

        const getMonthWeight = (label) => {
          const l = String(label).toLowerCase();
          if (l.includes("jan")) return 1;  if (l.includes("feb")) return 2;
          if (l.includes("mar")) return 3;  if (l.includes("apr")) return 4;
          if (l.includes("may")) return 5;  if (l.includes("jun")) return 6;
          if (l.includes("jul")) return 7;  if (l.includes("aug")) return 8;
          if (l.includes("sep")) return 9;  if (l.includes("oct")) return 10;
          if (l.includes("nov")) return 11; if (l.includes("dec")) return 12;
          return 99;
        };

        function YTDashboard() {
          const [months, setMonths] = useState([]);
          const [assets, setAssets] = useState([]);
          const [tab, setTab] = useState("overview");

          const [baseMonth, setBaseMonth] = useState("");
          const [targetMonth, setTargetMonth] = useState("");
          const [baseAssetMonth, setBaseAssetMonth] = useState("");
          const [targetAssetMonth, setTargetAssetMonth] = useState("");

          useEffect(() => {
            if (months.length >= 2 && !baseMonth && !targetMonth) {
              setBaseMonth(months[months.length - 2].label);
              setTargetMonth(months[months.length - 1].label);
            } else if (months.length === 1 && !targetMonth) {
              setTargetMonth(months[0].label);
            }
          }, [months, baseMonth, targetMonth]);

          useEffect(() => {
            if (assets.length >= 2 && !baseAssetMonth && !targetAssetMonth) {
              setBaseAssetMonth(assets[assets.length - 2].label);
              setTargetAssetMonth(assets[assets.length - 1].label);
            } else if (assets.length === 1 && !targetAssetMonth) {
              setTargetAssetMonth(assets[0].label);
            }
          }, [assets, baseAssetMonth, targetAssetMonth]);

          const handleRemoveData = (label, type) => {
            if (type === "channel") {
              setMonths(prev => prev.filter(m => m.label !== label));
              if (baseMonth === label) setBaseMonth("");
              if (targetMonth === label) setTargetMonth("");
            } else {
              setAssets(prev => prev.filter(a => a.label !== label));
              if (baseAssetMonth === label) setBaseAssetMonth("");
              if (targetAssetMonth === label) setTargetAssetMonth("");
            }
          };

          const handleFile = (fname, rows) => {
            if (!rows || rows.length === 0) return;
            const keys = Object.keys(rows[0]);
            const assetKey = keys.find(k => k.toLowerCase() === "asset" || k.toLowerCase() === "asset name");
            const channelKey = keys.find(k => k.toLowerCase() === "channel" || k.toLowerCase() === "channel title");
            
            const revKey = keys.find(k => k.toLowerCase().includes("estimated partner revenue")) || "";
            const premiumKey = keys.find(k => k.toLowerCase().includes("premium partner revenue")) || "";
            const pCpmKey = keys.find(k => k.toLowerCase().includes("playback-based cpm")) || "";
            const cpmKey = keys.find(k => k.toLowerCase() === "cpm (thb)") || "";
            const rpmKey = keys.find(k => k.toLowerCase() === "rpm (thb)") || "";
            const viewsKey = keys.find(k => k.toLowerCase() === "views") || "";

            const label = fname.replace(".csv", "").replace("Asset", "").trim().toUpperCase();
            const isAssetFile = !!assetKey;

            const processed = rows.filter(r => {
              const val = String(r[assetKey || channelKey] || "").trim().toLowerCase();
              return val !== "total" && val !== "";
            }).map(r => ({
              id: String(r[assetKey || channelKey] || "").trim(),
              name: String(r["Channel title"] || r["Asset name"] || r[assetKey || channelKey] || "Unknown").trim(),
              rev: parseFloat(String(r[revKey] || 0).replace(/[^0-9.-]/g, "")) || 0,
              premium: parseFloat(String(r[premiumKey] || 0).replace(/[^0-9.-]/g, "")) || 0,
              playbackCpm: parseFloat(String(r[pCpmKey] || 0).replace(/[^0-9.-]/g, "")) || 0,
              cpm: parseFloat(String(r[cpmKey] || 0).replace(/[^0-9.-]/g, "")) || 0,
              rpm: parseFloat(String(r[rpmKey] || 0).replace(/[^0-9.-]/g, "")) || 0,
              views: parseFloat(String(r[viewsKey] || 0).replace(/[^0-9.-]/g, "")) || 0
            }));

            if (isAssetFile) {
              setAssets(prev => [...prev.filter(a => a.label !== label), { label, data: processed }].sort((a,b)=>getMonthWeight(a.label)-getMonthWeight(b.label)));
            } else {
              setMonths(prev => [...prev.filter(m => m.label !== label), { label, data: processed }].sort((a,b)=>getMonthWeight(a.label)-getMonthWeight(b.label)));
            }
          };

          const channelAnalysis = useMemo(() => {
            const cur = months.find(m => m.label === targetMonth);
            const prev = months.find(m => m.label === baseMonth);
            if (!cur) return [];
            if (!prev) return cur.data.map(c => ({ ...c, rev1: 0, rev2: c.rev, growth: "0.0" }));
            return cur.data.map(c2 => {
              const c1 = prev.data.find(x => String(x.id).trim() === String(c2.id).trim());
              return { ...c2, rev1: c1 ? c1.rev : 0, rev2: c2.rev, growth: pct(c2.rev, c1 ? c1.rev : 0) };
            }).sort((a, b) => b.rev2 - a.rev2);
          }, [months, baseMonth, targetMonth]);

          const assetAnalysis = useMemo(() => {
            const cur = assets.find(a => a.label === targetAssetMonth);
            const prev = assets.find(a => a.label === baseAssetMonth);
            if (!cur) return [];
            if (!prev) return cur.data.map(a => ({ ...a, rev1: 0, rev2: a.rev, growth: "0.0" }));
            return cur.data.map(a2 => {
              const a1 = prev.data.find(x => String(x.id).trim() === String(a2.id).trim());
              return { ...a2, rev1: a1 ? a1.rev : 0, rev2: a2.rev, growth: pct(a2.rev, a1 ? a1.rev : 0) };
            }).sort((a, b) => b.rev2 - a.rev2);
          }, [assets, baseAssetMonth, targetAssetMonth]);

          const lineChartData = useMemo(() => {
            return months.map(m => ({
              name: m.label,
              "Estimated Revenue": m.data.reduce((s, x) => s + x.rev, 0),
              "Premium Revenue": m.data.reduce((s, x) => s + x.premium, 0)
            }));
          }, [months]);

          return (
            <div style={{ padding: 24 }}>
              <div style={{ background: "#ffffff", borderRadius: 12, padding: 18, border: "1px solid #e2e8f0", boxShadow: "0 1px 3px 0 rgba(0, 0, 0, 0.05)", marginBottom: 20 }}>
                <h2 style={{ margin: 0, color: "#0284c7" }}>📊 S1 MUSIC - ศูนย์บริหารข้อมูลเครือข่ายพันธมิตรรายเดือน</h2>
                <div style={{ marginTop: 12 }}>
                  {months.map(m => <span key={m.label} style={{ display: "inline-flex", alignItems: "center", background: "#e0f2fe", color: "#0369a1", padding: "4px 10px", borderRadius: "12px", fontSize: "11px", fontWeight: "bold", marginRight: "6px", marginBottom: "6px" }}>{m.label} (ช่อง) <button onClick={() => handleRemoveData(m.label, "channel")} style={{ background: "#fee2e2", color: "#dc2626", border: "none", borderRadius: "4px", padding: "2px 6px", fontSize: "10px", fontWeight: "bold", cursor: "pointer", marginLeft: "6px" }}>✕</button></span>)}
                  {assets.map(a => <span key={a.label} style={{ display: "inline-flex", alignItems: "center", background: "#f0fdf4", color: "#166534", padding: "4px 10px", borderRadius: "12px", fontSize: "11px", fontWeight: "bold", marginRight: "6px", marginBottom: "6px" }}>{a.label} (Asset) <button onClick={() => handleRemoveData(a.label, "asset")} style={{ background: "#fee2e2", color: "#dc2626", border: "none", borderRadius: "4px", padding: "2px 6px", fontSize: "10px", fontWeight: "bold", cursor: "pointer", marginLeft: "6px" }}>✕</button></span>)}
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 20 }}>
                <div style={{ background: "#ffffff", borderRadius: 12, padding: 18, border: "1px solid #e2e8f0", boxShadow: "0 1px 3px 0 rgba(0, 0, 0, 0.05)", marginBottom: 20 }}>
                  <div style={{ fontWeight: "bold", fontSize: 12, color: "#0284c7" }}>📁 เลือกไฟล์สรุปรายช่องทาง (เช่น MAR.csv, APR.csv)</div>
                  <input type="file" style={{ marginTop: 10 }} onChange={e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                      const lines = evt.target.result.split("\n").map(l => l.split(","));
                      const headers = lines[0].map(h => h.replace(/"/g, "").trim());
                      const rawData = lines.slice(1).filter(l => l.length >= headers.length).map(line => {
                        let obj = {}; headers.forEach((h, idx) => { obj[h] = line[idx]?.replace(/"/g, "").trim(); });
                        return obj;
                      });
                      handleFile(file.name, rawData);
                    };
                    reader.readAsText(file, "UTF-8");
                  }} />
                </div>
                <div style={{ background: "#ffffff", borderRadius: 12, padding: 18, border: "1px solid #e2e8f0", boxShadow: "0 1px 3px 0 rgba(0, 0, 0, 0.05)", marginBottom: 20 }}>
                  <div style={{ fontWeight: "bold", fontSize: 12, color: "#0284c7" }}>💎 เลือกไฟล์สรุปรายชิ้นงานลิขสิทธิ์ Asset เพลง</div>
                  <input type="file" style={{ marginTop: 10 }} onChange={e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                      const lines = evt.target.result.split("\n").map(l => l.split(","));
                      const headers = lines[0].map(h => h.replace(/"/g, "").trim());
                      const rawData = lines.slice(1).filter(l => l.length >= headers.length).map(line => {
                        let obj = {}; headers.forEach((h, idx) => { obj[h] = line[idx]?.replace(/"/g, "").trim(); });
                        return obj;
                      });
                      handleFile(file.name, rawData);
                    };
                    reader.readAsText(file, "UTF-8");
                  }} />
                </div>
              </div>

              <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
                <button onClick={() => setTab("overview")} style={{ padding: "8px 16px", background: tab === "overview" ? "#0284c7" : "#fff", color: tab === "overview" ? "#fff" : "#0f172a", border: "1px solid #e2e8f0", borderRadius: 20, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>📺 ตารางข้อมูลรายช่อง</button>
                <button onClick={() => setTab("assets")} style={{ padding: "8px 16px", background: tab === "assets" ? "#0284c7" : "#fff", color: tab === "assets" ? "#fff" : "#0f172a", border: "1px solid #e2e8f0", borderRadius: 20, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>🎵 ตารางข้อมูลราย Asset</button>
                <button onClick={() => setTab("charts")} style={{ padding: "8px 16px", background: tab === "charts" ? "#0284c7" : "#fff", color: tab === "charts" ? "#fff" : "#0f172a", border: "1px solid #e2e8f0", borderRadius: 20, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>📉 แผนภูมิเส้นการวิเคราะห์</button>
              </div>

              <div style={{ background: "#ffffff", borderRadius: 12, padding: 18, border: "1px solid #e2e8f0", boxShadow: "0 1px 3px 0 rgba(0, 0, 0, 0.05)", marginBottom: 20 }}>
                {tab === "overview" && (
                  <div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16 }}>
                      <span style={{ fontSize: 12, fontWeight: "bold" }}>เปรียบเทียบงวดเวลา:</span>
                      <select style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 7, padding: "7px 12px", color: "#0f172a", fontSize: 12, fontWeight: "bold" }} value={baseMonth} onChange={e => setBaseMonth(e.target.value)}><option value="">เลือกเดือนฐาน</option>{months.map(m=><option key={m.label}>{m.label}</option>)}</select>
                      <span>➔</span>
                      <select style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 7, padding: "7px 12px", color: "#0f172a", fontSize: 12, fontWeight: "bold" }} value={targetMonth} onChange={e => setTargetMonth(e.target.value)}><option value="">เลือกเดือนเปรียบเทียบ</option>{months.map(m=><option key={m.label}>{m.label}</option>)}</select>
                    </div>
                    <div style={{ overflowX: "auto" }}>
                      <table style={{ width: "100%", borderCollapse: "collapse" }}>
                        <thead>
                          <tr>
                            <th style={{ padding: "10px 12px", textAlign: "left", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>ชื่อช่องพาร์ทเนอร์</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>รายได้สุทธิ</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>Premium รายได้</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>ยอดวิวรวม</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>RPM</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>Playback CPM</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>อัตราเติบโต</th>
                          </tr>
                        </thead>
                        <tbody>
                          {channelAnalysis.length === 0 ? <tr><td colSpan={7} align="center" style={{padding:24, color:"#64748b"}}>[ระบบว่าง] กรุณาอัปโหลดไฟล์ CSV รายช่องเพื่อเริ่มแสดงผลตาราง</td></tr> : channelAnalysis.map((ch, i) => (
                            <tr key={i}>
                              <td style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}><b>{ch.name}</b></td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px", color: "#0284c7", fontWeight:"bold" }}>{fmtTHB(ch.rev)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtTHB(ch.premium)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtNum(ch.views)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px", color: "#16a34a" }}>{fmtTHB(ch.rpm)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtTHB(ch.playbackCpm)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px", color: parseFloat(ch.growth) >= 0 ? "green" : "red", fontWeight:"bold" }}>{ch.growth}%</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {tab === "assets" && (
                  <div>
                    <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 16 }}>
                      <span style={{ fontSize: 12, fontWeight: "bold" }}>เปรียบเทียบรอบ Asset:</span>
                      <select style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 7, padding: "7px 12px", color: "#0f172a", fontSize: 12, fontWeight: "bold" }} value={baseAssetMonth} onChange={e => setBaseAssetMonth(e.target.value)}><option value="">เลือกเดือนฐาน</option>{assets.map(a=><option key={a.label}>{a.label}</option>)}</select>
                      <span>➔</span>
                      <select style={{ background: "#ffffff", border: "1px solid #e2e8f0", borderRadius: 7, padding: "7px 12px", color: "#0f172a", fontSize: 12, fontWeight: "bold" }} value={targetAssetMonth} onChange={e => setTargetAssetMonth(e.target.value)}><option value="">เลือกเดือนเปรียบเทียบ</option>{assets.map(a=><option key={a.label}>{a.label}</option>)}</select>
                    </div>
                    <div style={{ overflowX: "auto" }}>
                      <table style={{ width: "100%", borderCollapse: "collapse" }}>
                        <thead>
                          <tr>
                            <th style={{ padding: "10px 12px", textAlign: "left", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>ชื่อ Asset ผลงานเพลง</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>รายได้ชิ้นงาน</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>Premium รายได้</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>ยอดวิว</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>RPM</th>
                            <th style={{ padding: "10px 12px", textAlign: "right", color: "#64748b", fontWeight: 600, borderBottom: "2px solid #e2e8f0", backgroundColor: "#f1f5f9", whiteSpace: "nowrap", fontSize: "11px" }}>เติบโต MoM</th>
                          </tr>
                        </thead>
                        <tbody>
                          {assetAnalysis.length === 0 ? <tr><td colSpan={6} align="center" style={{padding:24, color:"#64748b"}}>[ระบบว่าง] กรุณาอัปโหลดไฟล์ CSV ราย Asset เพื่อเริ่มแสดงผลตาราง</td></tr> : assetAnalysis.map((as, i) => (
                            <tr key={i}>
                              <td style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}><b>{as.name}</b></td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px", color: "#0284c7", fontWeight:"bold" }}>{fmtTHB(as.rev)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtTHB(as.premium)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtNum(as.views)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px" }}>{fmtTHB(as.rpm)}</td>
                              <td align="right" style={{ padding: "10px 12px", borderBottom: "1px solid #e2e8f0", whiteSpace: "nowrap", fontSize: "12px", color: parseFloat(as.growth) >= 0 ? "green" : "red", fontWeight:"bold" }}>{as.growth}%</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {tab === "charts" && (
                  <div style={{ height: 300 }}>
                    {lineChartData.length === 0 ? <div style={{textAlign:"center", padding:20, color:"#64748b"}}>โปรดอัปโหลดไฟล์ข้อมูลเพื่อแสดงผลกราฟแนวโน้ม</div> : (
                      <window.Recharts.ResponsiveContainer width="100%" height="100%">
                        <window.Recharts.AreaChart data={lineChartData}>
                          <window.Recharts.CartesianGrid strokeDasharray="3 3" />
                          <window.Recharts.XAxis dataKey="name" />
                          <window.Recharts.YAxis tickFormatter={v => `฿${(v / 1000).toFixed(0)}K`} />
                          <window.Recharts.Tooltip formatter={v => fmtTHB(Number(v))} />
                          <window.Recharts.Legend />
                          <window.Recharts.Area type="monotone" name="รายได้รวมทั้งหมด" dataKey="Estimated Revenue" stroke="#0284c7" fill="#e0f2fe" strokeWidth={3} />
                          <window.Recharts.Area type="monotone" name="รายได้จาก Premium" dataKey="Premium Revenue" stroke="#f59e0b" fill="transparent" strokeWidth={2} />

        }
